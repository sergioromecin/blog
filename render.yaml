services:
  - type: web
    name: blog
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"

databases:
  - name: blog-db
    plan: free
